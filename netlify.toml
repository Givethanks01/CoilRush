# Netlify config for Coil Rush. The site is static (public/); the API is one function.
[build]
  publish = "public"
  command = "echo 'No build step: static site + one function'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# The service worker must never be cached, or players would be stuck on an old version.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
